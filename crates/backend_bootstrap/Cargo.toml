[package]
name = "backend_bootstrap"
version = "0.1.0"
edition = "2024"

[dependencies]
backend_application = { path = "../backend_application" }
backend_common = { path = "../backend_common" }
backend_config = { path = "../backend_config" }
backend_http = { path = "../backend_http" }
backend_infrastructure = { path = "../backend_infrastructure" }
qdrant-client = "1.17.0"
sqlx = { version = "0.8.6", features = ["migrate", "postgres", "runtime-tokio-native-tls", "uuid", "chrono"] }
surrealdb = { version = "3.0.5", features = ["kv-mem", "protocol-ws"] }
thiserror = "2.0.18"
