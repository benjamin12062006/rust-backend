[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/expression_evaluator"]
resolver = "3"

[dependencies]
async-trait = "0.1.89"
dotenv = "0.15.0"
expression_evaluator = { path = "crates/expression_evaluator" }
pwhash = "1.0.0"
qdrant-client = "1.17.0"
serde = {version="1.0.228", features = ["derive"]}
sqlx = { version = "0.8.6", features = ["migrate", "postgres", "runtime-tokio-native-tls", "uuid", "chrono"] }
surrealdb = { version = "3.0.5", features = ["kv-mem", "protocol-ws"] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }
warp = { version = "0.4.2", features = ["server", "test"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
strip = true
opt-level = 3
panic = 'abort'
codegen-units = 1
